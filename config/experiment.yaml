project:
  name: "SafeHarness2.0"
  output_dir: "output"

data:
  dataset_name: "thu-coai/Agent-SafetyBench"
  dataset_file: null       # null = auto-download; or path like "data/agent_safety_bench/released_data.json"
  sequential_subset: true
  experiment_subset_size: 50
  demo_subset_size: 3

models:
  agent_models:
    - "deepseek_chat"
  judge_model: "deepseek_chat"

harness:
  types:
    - "hierarchical"
    - "debate"
    - "pipeline"
    - "decentralized"
  hierarchical_num_workers: 2
  debate_max_rounds: 3
  pipeline_max_revisions: 2
  decentralized_num_peers: 3
  decentralized_discussion_rounds: 2

security_modes:
  - "no_defense"
  - "system_prompt"
  - "single_guard"
  - "independent_guard"
  - "safe_harness_2"

safety:
  layer1:
    always_semantic: false
  layer2:
    tau_low: 0.3
    tau_high: 0.7
  layer3:
    token_ttl: 600
    token_max_invocations: 50
    denied_paths:
      - "/etc"
      - "/root"
      - "/etc/passwd"
      - "/etc/shadow"
  layer4:
    checkpoint_interval: 3
    max_degradation_level: 4
    recovery_window: 5
  layer5:
    trust_decay_rate: 0.1
    trust_recovery_rate: 0.02
    trust_quarantine_threshold: 0.3
    rate_limit_per_minute: 30
  entropy:
    window_size: 20
    threshold: 0.3

attacks:
  types:
    - "inter_agent_injection"
    - "agent_impersonation"
    - "privilege_escalation"
    - "cascading_failure"
    - "information_leakage"
    - "composite"

parallel:
  max_workers: 4

evaluation:
  llm_judge:
    temperature: 0.0
  bootstrap_samples: 1000

ablation:
  configs:
    - {name: "full", disable_layers: []}
    - {name: "w/o_L1", disable_layers: ["l1"]}
    - {name: "w/o_L2", disable_layers: ["l2"]}
    - {name: "w/o_L3", disable_layers: ["l3"]}
    - {name: "w/o_L4", disable_layers: ["l4"]}
    - {name: "w/o_L5", disable_layers: ["l5"]}
    - {name: "w/o_memory", disable_layers: ["memory"]}
